services:
  app:
    build:
      context: ../app
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: greenleaf
      DB_USER: greenleaf
      DB_PASSWORD: greenleaf
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: greenleaf
      POSTGRES_USER: greenleaf
      POSTGRES_PASSWORD: greenleaf
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenleaf"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: